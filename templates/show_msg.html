{% import 'components/buttons.html' as func %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styleForWeb/show_msg.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <title>Information</title>
</head>
<body class="error-page">
    <div class="error-container">
        <div class="error-icon">!</div>
        <h1>System Message</h1>
        
        <div class="error-box">
            {% if msg %}
                <p class="error-msg">{{ msg }}</p>
            {% else %}
                <p class="error-msg">An unexpected error has occurred. Please try again.</p>
            {% endif %}
        </div>

        <div class="error-footer">
            {{ func.back_button("← Back to Safety") }}
        </div>
    </div>
</body>
</html>
