{% import 'components/buttons.html' as func %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styleForWeb/stats_select.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <title>Last Stats</title>
</head>
<body>

<div class="selection-container">
    <h2>Select Time Range</h2>

    <a href="{{ url_for('stats', days=7) }}">
      <button>Last 7 Days</button>
    </a>

    <a href="{{ url_for('stats', days=14) }}">
      <button>Last 14 Days</button>
    </a>

    <a href="{{ url_for('stats', days=30) }}">
      <button>Last 30 Days</button>
    </a>

    <a href="{{ url_for('stats', days=90) }}">
      <button>Last 90 Days</button>
    </a>

    <a href="{{ url_for('stats', days=365) }}">
      <button>Last 365 Days</button>
    </a>

    <div style="margin-top: 30px;">
        {{ func.home_button("BACK") }}
    </div>
</div>

</body>
</html>
