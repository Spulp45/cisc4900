{% for t in track %}
<tr>
    <td>{{ t.id }}</td>
    <td>{{ t.name }}</td>
    <td>{{ t.description if t.description else "No description" }}</td>
    <td>
        <div class="action-buttons">
            <button type="button" onclick="enableEdit({{ t.id }})">Edit</button>
            <a href="/stats/{{ t.id }}"><button type="button">View Stats</button></a>
            </div>
    </td>
</tr>
{% endfor %}
