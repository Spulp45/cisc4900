{% for t in track %}
<tr>
    <td>{{ t.id }}</td>
    <td>{{ t.name }}</td>
    <td>{{ t.description if t.description else "No description" }}</td>
    <td>
        <div class="action-buttons">
                 <a href="{{ url_for('trip_stats', track_id=t.id) }}">
                  <button type="button">View Stats</button>
                </a>
            </div>
    </td>
</tr>
{% endfor %}
