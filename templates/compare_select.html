<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
  <title>Select Tracks</title>
</head>

<body>

<form method="POST" action="{{ url_for('compare_submit') }}">

  <table>
    <thead>
      <tr>
        <th>Select</th>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
      </tr>
    </thead>

    <tbody id="results">
      {% for row in tracks %}
        <tr>
          <td>
            <input 
              type="checkbox" 
              name="track_ids" 
              value="{{ row.id }}"
            >
          </td>

          <td>{{ row.id }}</td>
          <td>{{ row.name }}</td>

          <td>
            {{ row.description if row.description else "No description" }}
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

  <button type="submit">Compare Selected</button>

</form>

</body>
</html>
