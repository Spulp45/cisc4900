<!DOCTYPE html>
<html>
<head>
    <title>Login - GPX Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styleForWeb/login.css') }}">
</head>
<body>

    <div class="top-photo">
        <img src="{{ url_for('static', filename='Images/login/cloud.jpg') }}" alt="Cloud Logo">
    </div>

    <img src="{{ url_for('static', filename='Images/login/road.jpg') }}" id="bg-img" alt="Road Background">

    <div class="login-container">
        <h2>Welcome Back</h2>
        
        <form method="POST">
            <label>Username:</label>
            <input type="text" name="username" placeholder="Enter Username" required>
            
            <br><br>
            
            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter Password" required>
            
            <br><br>
            
            <button type="submit">Login</button>
            <br><br>
                <a href="/register">
                <button type="button">Register</button>
                </a>
             <br><br>
        </form>
    </div>

</body>
</html>
