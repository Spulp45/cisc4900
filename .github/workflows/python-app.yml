name: Python Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements.txt

    - name: Set environment variables for tests
      run: |
        echo "DATABASE_PATH=tests/test_database.db" >> $GITHUB_ENV
        echo "UPLOAD_DIRECTORY=tests/test_uploads" >> $GITHUB_ENV
        echo "TEMP_FOLDER=tests/test_temp" >> $GITHUB_ENV
        echo "FLASK_ENV=testing" >> $GITHUB_ENV

    - name: Run pytest
      run: |
        pytest -v
